[package]
name = "student-mcp"
version = "0.6.1"
edition = "2021"
default-run = "student-mcp"
description = "Local MCP for student services with browser configuration and a stable HTTPS link."
license = "MIT AND GPL-3.0-or-later"

[dependencies]
tiny_http = "0.12"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
cookie_store = { version = "0.21", default-features = false }
url = "2"
base64 = "0.22"
russh = { version = "0.65", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
sha2 = "0.11"
data-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
calamine = "0.37"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[profile.dev]
# Keep local rebuilds fast; release builds retain full size optimizations.
opt-level = 1
debug = 1
lto = false
codegen-units = 16
incremental = false
panic = "abort"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
