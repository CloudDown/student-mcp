[package]
name = "student-mcp"
version = "0.2.0"
edition = "2021"
description = "Tiny local MCP popup for Polytechnique Montréal students: Moodle, Proxmox, Claude connector over Tailscale Funnel."
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
