name: Build and release student installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libgtk2.0-dev 2>/dev/null || true
      - run: cargo test --release --locked
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke the MCP over stdio (linux-x64 only)
        if: matrix.label == 'linux-x64'
        shell: bash
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | target/x86_64-unknown-linux-gnu/release/student-mcp | grep -q student_status
      - name: Fetch verified Cloudflare tunnel sidecar
        shell: bash
        run: python3 scripts/fetch-cloudflared.py --label ${{ matrix.label }} --output sidecar
      - name: Smoke the tunnel component
        shell: bash
        run: ./sidecar/cloudflared${{ runner.os == 'Windows' && '.exe' || '' }} --version
      - name: Package ZIP and checksum
        shell: bash
        run: python3 scripts/archive-release.py --label ${{ matrix.label }} --binary target/${{ matrix.target }}/release/student-mcp${{ runner.os == 'Windows' && '.exe' || '' }} --sidecar-dir sidecar
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
