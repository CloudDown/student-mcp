name: Build and release student installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: bun-linux-x64
            label: linux-x64
            suffix: ''
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            label: linux-arm64
            suffix: ''
          - runner: windows-2025
            target: bun-windows-x64
            label: windows-x64
            suffix: '.exe'
          - runner: windows-11-arm
            target: bun-windows-arm64
            label: windows-arm64
            suffix: '.exe'
          - runner: macos-15
            target: bun-darwin-arm64
            label: macos-arm64
            suffix: ''
          - runner: macos-15-intel
            target: bun-darwin-x64
            label: macos-x64
            suffix: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm test && npm run typecheck && npm run build
        shell: bash
      - name: Compile one standalone executable
        shell: bash
        run: |
          mkdir -p build
          bun build --compile --target=${{ matrix.target }} --no-compile-autoload-dotenv --no-compile-autoload-bunfig ./scripts/binary-entry.ts --outfile build/student-mcp${{ matrix.suffix }}
      - name: Verify the actual executable over MCP with a mock Moodle
        shell: bash
        run: node scripts/smoke-binary.mjs build/student-mcp${{ matrix.suffix }}
      - name: Package ZIP and checksum
        run: python scripts/archive-release.py ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
