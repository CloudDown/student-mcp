name: Build and release student installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            label: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libgtk2.0-dev 2>/dev/null || true
      - run: cargo test --release --locked
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke the MCP over stdio (linux-x64 only)
        if: matrix.label == 'linux-x64'
        shell: bash
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | target/x86_64-unknown-linux-gnu/release/student-mcp | grep -q student_status
      - name: Package ZIP and checksum
        shell: bash
        run: python scripts/archive-release.py --label ${{ matrix.label }} --binary target/${{ matrix.target }}/release/student-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Install Inno Setup (pinned and checksum-verified)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup checksum mismatch'
          }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Package native desktop installer and checksum
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python scripts/package-desktop.py --label ${{ matrix.label }} \
            --binary target/${{ matrix.target }}/release/student-mcp${{ runner.os == 'Windows' && '.exe' || '' }} \
            --launcher target/${{ matrix.target }}/release/student-mcp-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Smoke Windows install and uninstall (no GUI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'student-mcp smoke'
          $setup = (Resolve-Path 'release/student-mcp-${{ matrix.label }}-setup.exe').Path
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          if (-not (Test-Path "$destination/student-mcp-desktop.exe")) { throw 'Desktop launcher missing' }
          & "$destination/student-mcp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
          $process = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
          if (Test-Path "$destination/student-mcp.exe") { throw 'Uninstall left the app behind' }
      - name: Smoke macOS disk image, install and upgrade (no GUI)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image="release/student-mcp-${{ matrix.label }}.dmg"
          mount="$RUNNER_TEMP/student-mcp-volume"
          hdiutil verify "$image"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          installer="$mount/Install student-mcp.app"
          codesign --verify --deep --strict "$installer"
          "$installer/Contents/Resources/student-mcp.app/Contents/MacOS/student-mcp" --version
          test ! -e /Applications/student-mcp.app
          for pass in install upgrade; do
            /bin/bash "$installer/Contents/Resources/install-macos.sh" "$installer/Contents/Resources/student-mcp.app"
            codesign --verify --deep --strict /Applications/student-mcp.app
            /Applications/student-mcp.app/Contents/MacOS/student-mcp --version
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Desktop installation
            - **Windows:** download `student-mcp-windows-<architecture>-setup.exe`, double-click it and keep **Open student-mcp** selected.
            - **macOS:** download `student-mcp-macos-<architecture>.dmg`, open it and double-click **Install student-mcp**. Confirm **Install and open**.
            - Choose **arm64** for Apple Silicon / Windows ARM, **x64** for Intel / AMD.
            - These builds are not yet publisher-signed/notarized; Windows/macOS may warn or block them. Do not disable system security protections.
            - Portable ZIPs and `install.sh` / `install.ps1` remain available for advanced use. SHA-256 files verify download integrity, not publisher identity.
          files: release/*
