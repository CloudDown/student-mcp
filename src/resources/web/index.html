.tools-heading{position:relative;padding-top:4rem;margin-bottom:2rem}
.tools-heading .back{position:absolute;top:0;left:0}
.tools-heading h1{font-size:2.125rem}
.tools-heading .subtitle{margin:.5rem 0 0}
.tools-list{display:flex;flex-direction:column;gap:.75rem}
.tool-card{padding:1.25rem;background:var(--white);border:1px solid var(--border);border-radius:1.25rem;box-shadow:var(--shadow)}
.tool-card h2{font:600 .875rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;margin:0}
.tool-card p{font-size:.875rem;line-height:1.6;color:var(--subtle);margin:.625rem 0 0;overflow-wrap:anywhere}
@media(hover:hover){.language-menu button:hover{background:var(--hover)}}
@media(prefers-reduced-transparency:reduce),(prefers-contrast:more){.language-menu,.language-control>.icon-button{background:#fff;backdrop-filter:none}}

function t(text){
 if(language==='en')return text;
 const index=language==='fr'?0:1;
 if(translations[text])return translations[text][index];
 const connect=text.match(/^Connect to (Moodle|Omnivox|Brightspace)$/);
 if(connect)return (index===0?'Se connecter à ':'Conectar con ')+connect[1];
 const service=text.match(/^(Moodle|Omnivox|Brightspace) (manage connection|connect)$/);
 if(service)return service[1]+' — '+(service[2]==='connect'?['Se connecter','Conectar'][index]:['Gérer la connexion','Gestionar conexión'][index]);
 const help=text.match(/^(Hide|Show)( help for)? (.+)$/);
 if(help)return (help[1]==='Hide'?['Masquer','Ocultar'][index]:['Afficher','Mostrar'][index])+(help[2]?[' l’aide pour ',' ayuda para '][index]:' ')+t(help[3]);
 const emailPrompt=text.match(/^Enter the 6-digit security code sent by email(?: to (.+))?\.$/);
 if(emailPrompt)return (index===0?'Saisissez le code de sécurité à 6 chiffres envoyé par courriel':'Introduce el código de seguridad de 6 dígitos enviado por correo')+(emailPrompt[1]?(index===0?' à ':' a ')+emailPrompt[1]:'')+'.';
 return text;
}
function localize(screen){
 const walker=document.createTreeWalker(screen,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(node.parentElement.closest('.account-row-title,.link-detail,.notice,.hint,[data-server-text]'))continue;
  const text=node.textContent.trim();
  if(text)node.textContent=node.textContent.replace(text,t(text));
 }
 for(const el of screen.querySelectorAll('[aria-label],[placeholder]'))for(const attr of ['aria-label','placeholder']){
  if(el.hasAttribute(attr)&&!el.hasAttribute('data-account'))el.setAttribute(attr,t(el.getAttribute(attr)));
 }
}
function updateLanguageControl(){
 document.documentElement.lang=language;
 $('language-button').setAttribute('aria-label',t('Change language'));
 $('language-menu').setAttribute('aria-label',t('Language'));
 for(const button of document.querySelectorAll('[data-language]'))button.setAttribute('aria-pressed',String(button.dataset.language===language));
}
function closeLanguages(restoreFocus=false){$('language-menu').hidden=true;$('language-button').setAttribute('aria-expanded','false');if(restoreFocus)$('language-button').focus()}
document.addEventListener('click',e=>{
 const choice=e.target.closest('[data-language]');
 if(choice){language=choice.dataset.language;try{localStorage.setItem('student-mcp.language',language)}catch{}updateLanguageControl();render();closeLanguages(true);return}
 if(e.target.closest('#language-button')){const open=$('language-menu').hidden;$('language-menu').hidden=!open;$('language-button').setAttribute('aria-expanded',String(open));if(open)$('language-menu').querySelector('[aria-pressed="true"]').focus();return}
 if(!e.target.closest('.language-control'))closeLanguages();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('language-menu').hidden){e.preventDefault();closeLanguages(true)}});
document.addEventListener('focusin',e=>{if(!e.target.closest('.language-control'))closeLanguages()});
updateLanguageControl();

const toolCatalogs={};
async function loadTools(service){
 if(toolCatalogs[service]?.loading||toolCatalogs[service]?.tools)return;
 toolCatalogs[service]={loading:true};render();
 try{const result=await api('/tools/'+encodeURIComponent(service));toolCatalogs[service]={tools:result.tools}}
 catch{toolCatalogs[service]={error:true}}
 if(state.screen==='tools'&&state.service===service)render();
}
function toolsScreen(){
 const catalog=toolCatalogs[state.service];
 const content=catalog?.error?`<div class="notice error" role="alert">${t('Could not load tools.')}</div><button class="full-button secondary" data-tools-retry>Retry</button>`:!catalog?.tools?'<p class="busy" role="status">Loading tools…</p>':catalog.tools.length?`<div class="tools-list">${catalog.tools.map(tool=>{
  const translated=language!=='en'&&toolDescriptions[tool.name]?.[language==='fr'?0:1];
  return `<article class="tool-card"><h2>${esc(tool.name)}</h2><p lang="${translated?language:'en'}" data-server-text>${esc(translated||tool.description)}</p></article>`
 }).join('')}</div>`:'<p class="subtitle">No tools available.</p>';
 return `<section><header class="tools-heading"><button class="back" data-screen="service" aria-label="Back to connection">${icon('back')}</button><h1>MCP tools</h1><p class="subtitle">${names[state.service]}${catalog?.tools?' · '+catalog.tools.length:''}</p></header>${content}</section>`;
}
async function api(path,data){const response=await fetch(path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const value=await response.json();if(!response.ok)throw Error(value.error||'Request failed');return value;}

 <div class="card">${publicReady?`<div class="status-row"><span><i class="status-dot"></i>Public link active</span><button class="icon-button" data-copy="public" aria-label="Copy public link">${icon('copy')}</button></div><div class="link-detail">${esc(state.link)}</div>`:`<p class="subtitle">${esc(publicMessage())}</p>${state.tunnel.startsWith('Failed(')?`<div class="hint">${esc(state.tunnel)}</div>`:''}${state.tunnel.startsWith('Starting')||state.tunnel.startsWith('Reconnecting')?'<p class="busy">This can take a few seconds.</p>':''}`}</div>
  ${notice()}`}
function publicMessage(){if(!state.public||state.tunnel==='Stopped')return 'Public link is off. Turn the switch on to restore your stable HTTPS link through srv.us. No account needed.';if(state.tunnel.startsWith('Starting'))return 'Opening your stable HTTPS link through srv.us.';if(state.tunnel.startsWith('Reconnecting'))return 'Reconnecting to srv.us. Your saved link stays the same.';if(state.tunnel.startsWith('Failed'))return 'The public link was not created. Turn the switch on to try again.';return 'No service is connected yet. Turn the switch on to create the HTTPS link anyway.'}
let renderedScreen='',refreshing=false;
function render(){
 const screen=$('screen'),route=state.screen+':'+state.service;
 const active=document.activeElement;
  const focus=active&&screen.contains(active)?{id:active.id,attr:['data-screen','data-copy','data-action','data-eye','data-help','data-open','data-account','data-add','name'].find(a=>active.hasAttribute(a)),value:null}:null;
 if(focus?.attr)focus.value=active.getAttribute(focus.attr);
  screen.innerHTML=state.screen==='home'?home():state.screen==='links'?linkScreen():state.screen==='tools'?toolsScreen():serviceScreen();
  localize(screen);
 if(route!==renderedScreen){const heading=screen.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}window.scrollTo(0,0)}
 else if(focus){const target=focus.id?document.getElementById(focus.id):focus.attr?[...screen.querySelectorAll('['+focus.attr+']')].find(el=>el.getAttribute(focus.attr)===focus.value):null;target?.focus({preventScroll:true})}
 renderedScreen=route;
}
async function refresh(background=false){
 if(refreshing)return;refreshing=true;
 try{
  const d=await api('/state');
  // Polling may update status, but must never replace an active form or pending settings.
  const changed=JSON.stringify([state.accounts,state.link,state.localLink,state.tunnel,state.local,state.public,state.autostart])!==JSON.stringify([d.accounts,d.link,d.local_link,d.tunnel,d.local,d.public,d.autostart]);
  state.accounts=d.accounts;state.link=d.link;state.localLink=d.local_link;state.tunnel=d.tunnel;
  state.autostart=!!d.autostart;
  if(!background||state.screen!=='links'){state.local=d.local;state.public=d.public}
  if(!background){state.verification=d.verification;render()}
  else if(changed&&(state.screen==='home'||state.screen==='links'))render();
  }catch(e){if(!background){state.notice={text:e.message,error:true};render()}else $('live').textContent=t('Connection status unavailable. Retrying…')}
 finally{refreshing=false}
}
async function checkSelected(){
 const service=state.service,id=state.accountId;
 try{const r=await api('/action',{action:'check',service,id});if(state.service===service&&state.accountId===id){state.health={text:r.message};if(state.screen==='service'&&!state.editing)render()}}
 catch(e){if(state.service===service&&state.accountId===id){state.health={text:e.message,error:true};if(state.screen==='service'&&!state.editing)render()}}
}
function openService(service){state.service=service;state.screen='service';state.advanced=false;state.useToken=false;state.otherSchool=false;state.editing=false;state.draft={};state.visible={};state.help={};state.notice=null;state.health=null;const a=state.accounts.find(x=>x.service===service);state.accountId=a?.id||'';if(service==='moodle'&&a&&a.url!=='https://moodle.polymtl.ca')state.otherSchool=true;if(a)checkSelected();render()}
async function send(data){if(state.busy)return;state.busy=true;render();try{const r=await api('/action',data);state.notice=r.message?{text:r.message}:null;if(r.verification){state.verification=r.verification;state.screen='service'}else if(['connect','verify','cancel','disconnect'].includes(data.action)){state.verification=null;if(data.action==='verify'){state.screen='home';state.editing=false}else if(data.action==='cancel'){state.screen='service'}else state.screen='home'}if(data.action==='connect')state.editing=false;if(r.stop)state.notice={text:'student-mcp stopped'};await refresh()}catch(e){if(data.action==='autostart')state.autostart=!data.enabled;state.notice={text:e.message,error:true}}finally{state.busy=false;render()}}
document.addEventListener('click',async e=>{
 if(e.target.closest('[data-tools]')){state.screen='tools';render();loadTools(state.service);return}
 if(e.target.closest('[data-tools-retry]')){loadTools(state.service);return}
 const copy=e.target.closest('[data-copy]');
 if(copy){
  e.stopPropagation();const local=copy.dataset.copy==='local',url=local?state.localLink:state.link;
  if(!url||(local?!state.local:!state.tunnel.startsWith('Ready(')))return;
   try{
    await navigator.clipboard.writeText(url);$('live').textContent=t('Copied');
    const original=copy.innerHTML,aria=copy.getAttribute('aria-label');
    copy.innerHTML=icon('check');copy.classList.add('copy-confirmed');copy.setAttribute('aria-label',t('Copied'));
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)copy.querySelector('svg').animate([{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1)'}],{duration:180,easing:'cubic-bezier(0.23, 1, 0.32, 1)'});
    setTimeout(()=>{if(!copy.isConnected)return;copy.innerHTML=original;copy.classList.remove('copy-confirmed');copy.setAttribute('aria-label',aria)},1300);
   }
  catch{state.notice={text:'Could not copy the link. Open connection settings and select the link to copy it manually.',error:true}}
   if(state.notice?.error)render();return;
 }
 const screen=e.target.closest('[data-screen]');
 if(screen){if(screen.dataset.screen==='home'&&state.verification){send({action:'cancel'});state.verification=null;}state.screen=screen.dataset.screen;state.notice=null;render();return}
 const opener=e.target.closest('[data-open]');if(opener){openService(opener.dataset.open);return}
 const account=e.target.closest('[data-account]');if(account){if(account.dataset.account===state.accountId&&!state.editing)return;state.accountId=account.dataset.account;state.editing=false;state.draft={};state.visible={};state.help={};state.health=null;state.notice=null;state.advanced=false;state.otherSchool=state.service==='moodle'&&!!selected()&&selected().url!=='https://moodle.polymtl.ca';checkSelected();render();return}
 if(e.target.closest('[data-add]')){state.accountId='';state.editing=true;state.draft={};state.visible={};state.help={};state.health=null;state.advanced=false;state.useToken=false;state.otherSchool=false;render();return}
 const eye=e.target.closest('[data-eye]');
  if(eye){const name=eye.dataset.eye;state.visible[name]=!state.visible[name];const field=$('f-'+name);field.type=state.visible[name]?'text':'password';eye.querySelector('.eye-slash').toggleAttribute('hidden',state.visible[name]);eye.setAttribute('aria-label',t((state.visible[name]?'Hide ':'Show ')+field.labels[0].textContent));return}
 const help=e.target.closest('[data-help]');
 if(help){const name=help.dataset.help;state.help[name]=!state.help[name];render();return}
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(action==='edit'){state.editing=true;state.advanced=false;state.draft={};state.visible={};state.help={};render()}
 else if(action==='check'){if(selected())checkSelected()}
 else if(action==='disconnect'){const a=selected();if(a)send({action,service:state.service,id:a.id})}
 else if(action==='resend'||action==='cancel'){send({action})}
 else if(action==='apply-links'){const local=document.querySelector('[name=local]').checked,publicOn=document.querySelector('[name=public]').checked;send({action:'links',local:local||publicOn,public:publicOn})}
 else if(action==='stop')send({action:'stop'});
});
function connectReady(form){const v=Object.fromEntries(new FormData(form)),a=selected();if(state.service==='moodle')return !!v.token||!!v.username&&!!v.password;if(state.service==='omnivox')return v.token?!!v.gateway_url:!!(v.url||a?.url)&&!!v.username&&!!v.password;if(state.service==='brightspace')return brightspaceReady(v,a);return !!(v.url||a?.url)&&(!!v.token||!!v.username&&!!v.password)}
document.addEventListener('change',e=>{if(e.target.name==='local'||e.target.name==='public'){const local=e.target.name==='local'?e.target.checked:state.local,publicOn=e.target.name==='public'?e.target.checked:state.public;state.local=local;state.public=publicOn;send({action:'links',local,public:publicOn})}else if(e.target.name==='autostart'){state.autostart=e.target.checked;send({action:'autostart',enabled:state.autostart})}});
document.addEventListener('input',e=>{if(e.target.name)state.draft[e.target.name]=e.target.value;if(e.target.form?.id==='connect-form')e.target.form.querySelector('button[type="submit"],button:not([type])').disabled=!connectReady(e.target.form)});
document.addEventListener('toggle',e=>{if(e.target.matches('.advanced'))state.advanced=e.target.open},true);
document.addEventListener('change',e=>{if(e.target.id==='account-picker'){state.accountId=e.target.value==='__new__'?'':e.target.value;state.editing=e.target.value==='__new__';state.draft={};state.visible={};state.help={};state.health=null;state.verification=null;state.advanced=false;state.useToken=false;state.otherSchool=state.service==='moodle'&&!!selected()&&selected().url!=='https://moodle.polymtl.ca';if(selected())checkSelected();render()}if(e.target.name==='use_token'){state.useToken=e.target.checked;render()}if(e.target.name==='other_school'){state.otherSchool=e.target.checked;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='connect-form'){e.preventDefault();const form=e.target,d=Object.fromEntries(new FormData(form)),a=selected();if(!connectReady(form))return;d.service=state.service;d.action='connect';d.id=state.accountId||'';if(state.service==='moodle')d.url=d.url||a?.url||'https://moodle.polymtl.ca';if(state.service==='omnivox'&&d.token)d.url=d.gateway_url;delete d.gateway_url;if(state.service==='brightspace'){const session=(d.d2l_session||'').trim(),secure=(d.d2l_secure||'').trim();if(session||secure){d.token=`d2lSessionVal=${session}; d2lSecureSessionVal=${secure}`}delete d.d2l_session;delete d.d2l_secure}for(const name of ['password','token','d2l_session','d2l_secure'])state.draft[name]='';send(d)}else if(e.target.id==='verify-form'){e.preventDefault();const code=e.target.elements.code.value;state.draft.code='';send({action:'verify',code})}});
refresh();const timer=setInterval(()=>{if(!document.hidden&&!state.busy)refresh(true)},1500);
</script></body></html>
