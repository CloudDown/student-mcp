<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Student MCP</title><link rel="icon" type="image/png" href="/assets/app-icon.png">
<link rel="stylesheet" href="/app.css"></head>
<body>
<header class="global-bar">
 <div id="update-control" class="update-control">
  <span id="update-label" class="update-label" role="status"></span>
  <button id="update-button" class="icon-button" type="button" aria-label="Install update" title="Install update" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></button>
  <div id="update-status" class="update-status" role="status" hidden></div>
 </div>
 <div class="global-actions">
  <label class="startup-row app-startup" id="app-startup" hidden><span id="app-startup-label"></span><input class="switch" type="checkbox" name="autostart"></label>
  <div class="language-control">
   <button id="language-button" class="icon-button" type="button" aria-label="Change language" aria-expanded="false" aria-controls="language-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 3v2M5 5c1 5 4 8 8 10M13 5c-1 5-4 8-9 11M14 21l4-10 4 10M15.5 17h5"/></svg></button>
   <div id="language-menu" class="language-menu" hidden role="group" aria-label="Language">
    <button type="button" data-language="fr" lang="fr" aria-pressed="false"><span class="language-flag" aria-hidden="true"><svg viewBox="0 0 28 20"><path fill="#1d3f8f" d="M0 0h9.34v20H0z"/><path fill="#fff" d="M9.33 0h9.34v20H9.33z"/><path fill="#ed2939" d="M18.67 0H28v20h-9.33z"/></svg></span>Français<span class="language-check" aria-hidden="true">✓</span></button>
    <button type="button" data-language="es" lang="es" aria-pressed="false"><span class="language-flag" aria-hidden="true"><svg viewBox="0 0 28 20"><path fill="#aa151b" d="M0 0h28v20H0z"/><path fill="#f1bf00" d="M0 5h28v10H0z"/><path fill="#aa151b" d="M7 7h3v5H7z"/><path fill="#f1bf00" d="M7.6 8h1.8v2H7.6z"/></svg></span>Español<span class="language-check" aria-hidden="true">✓</span></button>
    <button type="button" data-language="en" lang="en" aria-pressed="false"><span class="language-flag" aria-hidden="true"><svg viewBox="0 0 28 20"><path fill="#012169" d="M0 0h28v20H0z"/><path stroke="#fff" stroke-width="5" d="m0 0 28 20M28 0 0 20"/><path stroke="#c8102e" stroke-width="2" d="m0 0 28 20M28 0 0 20"/><path stroke="#fff" stroke-width="8" d="M14 0v20M0 10h28"/><path stroke="#c8102e" stroke-width="4" d="M14 0v20M0 10h28"/></svg></span>English<span class="language-check" aria-hidden="true">✓</span></button>
   </div>
  </div>
 </div>
</header>
<main class="app"><div id="screen" class="screen"></div></main>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="lightbox" class="lightbox" aria-label="Screenshot"><button class="lightbox-close" type="button" data-lightbox-close aria-label="Close">×</button><img id="lightbox-image" alt=""></dialog>
<script src="/app.js"></script></body></html>
