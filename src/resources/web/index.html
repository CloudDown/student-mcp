function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){const paths={copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h1"/>',check:'<path d="m5 12 4 4L19 6"/>',back:'<path d="m12 5-7 7 7 7M5 12h14"/>',refresh:'<path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.back}</svg>`}
function home(){const tiles=['moodle','omnivox','brightspace'].map(s=>{const connected=state.accounts.some(a=>a.service===s);return `<button class="tile ${connected?'connected':''}" data-open="${s}" aria-label="${names[s]} ${connected?'manage connection':'connect'}"><img src="/assets/${s}.png" alt=""><span>${names[s]}</span>${connected?'<i class="dot"></i>':''}</button>`}).join('');const ready=state.tunnel.startsWith('Ready(');let value=ready?state.link:state.tunnel.startsWith('Starting')?'Creating your public link…':state.tunnel.startsWith('Reconnecting')?'Reconnecting your public link…':state.tunnel.startsWith('Failed')?'Public link unavailable — click to retry':state.tunnel==='Stopped'?'Public link off — click to enable':'Connect a service to create your link';return `<section class="home"><div class="tiles">${tiles}</div><div class="link-card"><button class="link-open" data-screen="links"><span class="link-title">AI connection</span><span class="link-value">${esc(value)}</span></button><button class="icon-button copy-home" data-copy="home" aria-label="Copy link" ${ready?'':'disabled'}>${icon('copy')}</button></div>${notice()}</section>`}
function header(service){return `<header class="service-head"><button class="back" data-screen="home" aria-label="Back to services">${icon('back')}</button><div class="logo-frame"><img src="/assets/${service}.png" alt=""></div><h1>${names[service]}</h1><div class="subtitle">${service==='moodle'&&state.otherSchool?'Your Moodle account':subtitles[service]}</div></header>`}
function accountPicker(){const accounts=state.accounts.filter(a=>a.service===state.service);if(!accounts.length||state.verification||state.editing)return '';return `<div class="account-heading">Accounts</div><div class="account-list">${accounts.map(a=>{const active=a.id===state.accountId;let host;try{host=new URL(a.url).host}catch{host=a.url||names[state.service]}return `<button class="account-row ${active?'active':''}" data-account="${esc(a.id)}" aria-current="${active?'true':'false'}" aria-label="${esc(host)}${active?', selected':''}"><span class="account-row-main"><span class="account-row-title">${esc(host)}</span></span>${active?'<span class="account-mark" aria-hidden="true">✓</span>':''}</button>`}).join('')}<button class="account-row add-account ${selected()?'':'active'}" data-add><span class="plus" aria-hidden="true">+</span><span>Add account</span></button></div>`}
function input(name,label,placeholder,type='text',value='',autofill=''){value=state.draft[name]??value;const secret=type==='password';return `<div class="field"><div class="field-head"><label for="f-${name}">${label}</label>${secret?`<button type="button" class="icon-button eye" data-eye="${name}" aria-label="${state.visible[name]?'Hide':'Show'} ${label}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="M4 4 20 20" ${state.visible[name]?'hidden':''}/></svg></button>`:''}</div><input id="f-${name}" class="input" name="${name}" type="${secret&&state.visible[name]?'text':type}" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="${autofill||'off'}" ${name==='code'?'inputmode="numeric" maxlength="6"':''}></div>`}
function advanced(){return `<details class="advanced" ${state.advanced?'open':''}><summary>Advanced options<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></summary><div class="advanced-body">${advancedFields()}</div></details>`}
function advancedFields(){const a=selected();if(state.service==='moodle')return input('url','Moodle address','https://moodle.polymtl.ca','url',a?.url||'')+input('token','Token','Moodle mobile token','password','','off');
if(state.service==='omnivox')return input('gateway_url','Omnivox MCP address','http://127.0.0.1:3000','url')+input('token','Access key','accessKey.txt','password','','off')+'<p class="footnote">Run Beat-YT/omnivox-mcp, log in there, then paste its address and access key.</p>';
return input('token','Token or session cookies','Access token or d2lSessionVal=…','password','','off')}
function loginScreenContent(){const a=selected(),s=state.service;let fields='',ready=false;if(s==='moodle'){fields=input('username','Username','firstname.lastname','text','','username')+input('password','Password','Moodle password','password','','current-password');ready=!!state.draft.token||!!state.draft.username&&!!state.draft.password}
if(s==='omnivox'){fields=input('url','College address','https://cegepxxx.omnivox.ca','url',a?.url||'')+input('username','Student number','0000000','text','','username')+input('password','Password','Omnivox password','password','','current-password');ready=state.draft.token?!!state.draft.gateway_url:!!(state.draft.url||a?.url)&&!!state.draft.username&&!!state.draft.password}
if(s==='brightspace'){fields=input('url','Site address','https://mycourses.mcgill.ca','url',a?.url||'')+input('username','Username','School username','text','','username')+input('password','Password','Brightspace password','password','','current-password');ready=!!(state.draft.url||a?.url)&&(!!state.draft.token||!!state.draft.username&&!!state.draft.password)}
return `<form id="connect-form">${fields}${advanced()}${notice()}${state.busy?'<p class="busy">Checking the connection…</p>':''}<button class="full-button primary" ${!ready||state.busy?'disabled':''}>${state.busy?'Connecting…':a?'Save changes':`Connect to ${names[s]}`}</button></form>`}
function connectionSummary(){if(state.health?.error)return 'Connection failed';if(!state.health)return 'Checking connection…';const text=state.health.text;if(state.service==='moodle'){const user=text.match(/signed in as ([^(]+?)(?:\s*\(Moodle|\.$)/i)?.[1]?.trim();return user?`Connected · ${user}`:'Connected'}return state.service==='omnivox'?'Connected':state.service==='brightspace'?'Connected':esc(text)}
function manageScreenContent(){return `<div class="card manage-card"><div class="status-row"><span class="manage-status"><i class="status-dot ${state.health?.error?'offline':''}"></i><span class="manage-status-text">${esc(connectionSummary())}</span></span><button class="icon-button" data-action="check" aria-label="Retry">${icon('refresh')}</button></div>${state.health?.error?`<p class="hint">${esc(state.health.text)}</p>`:''}<div class="manage-actions"><button class="secondary" data-action="edit">Change login</button><button class="danger" data-action="disconnect">Disconnect</button></div></div>${notice()}`}
function serviceScreen(){const a=selected();return `${header(state.service)}<section class="form-screen">${accountPicker()}${state.verification?verifyScreenContent():a&&!state.editing?manageScreenContent():loginScreenContent()}</section>`}
function verifyScreenContent(){return `<h2>Identity verification</h2><p class="subtitle">${esc(state.verification)}</p><form id="verify-form">${input('code','Security code (6 digits)','000000','text','','one-time-code')}${notice()}<button class="full-button primary" ${state.busy?'disabled':''}>${state.busy?'Verifying…':'Verify and connect'}</button></form><button class="full-button secondary" data-action="resend" ${state.busy?'disabled':''}>Send a new code</button><button class="full-button secondary" data-action="cancel" ${state.busy?'disabled':''}>Cancel verification</button>`}
function linkScreen(){const publicReady=state.tunnel.startsWith('Ready(');return `
 <button class="back" data-screen="home" aria-label="Back to services">${icon('back')}</button>
 <label class="section-label">LOCAL LINK <input class="switch" type="checkbox" name="local" ${state.local?'checked':''}></label>
  <div class="card"><div class="status-row"><span>${state.local?'<i class="status-dot"></i>Local link active':'Local link off'}</span><button class="icon-button" data-copy="local" aria-label="Copy local link" ${state.local&&state.localLink?'':'disabled'}>${icon('copy')}</button></div>${state.local?`<div class="link-detail">${esc(state.localLink)}</div>`:''}</div>
 <label class="section-label">PUBLIC LINK <input class="switch" type="checkbox" name="public" ${state.public?'checked':''}></label>
 <div class="card">${publicReady?`<div class="status-row"><span><i class="status-dot"></i>Public link active</span><button class="icon-button" data-copy="public" aria-label="Copy public link">${icon('copy')}</button></div><div class="link-detail">${esc(state.link)}</div>`:`<p class="subtitle">${esc(publicMessage())}</p>${state.tunnel.startsWith('Failed(')?`<div class="hint">${esc(state.tunnel)}</div>`:''}${state.tunnel.startsWith('Starting')||state.tunnel.startsWith('Reconnecting')?'<p class="busy">This can take a few seconds.</p>':''}`}</div>
 ${notice()}`}
function publicMessage(){if(!state.public||state.tunnel==='Stopped')return 'Public link is off. Turn the switch on to restore your stable HTTPS link through srv.us. No account needed.';if(state.tunnel.startsWith('Starting'))return 'Opening your stable HTTPS link through srv.us.';if(state.tunnel.startsWith('Reconnecting'))return 'Reconnecting to srv.us. Your saved link stays the same.';if(state.tunnel.startsWith('Failed'))return 'The public link was not created. Turn the switch on to try again.';return 'No service is connected yet. Turn the switch on to create the HTTPS link anyway.'}
let renderedScreen='',refreshing=false;
function render(){
 const screen=$('screen'),route=state.screen+':'+state.service;
 const active=document.activeElement;
 const focus=active&&screen.contains(active)?{id:active.id,attr:['data-screen','data-copy','data-action','data-eye','data-open','name'].find(a=>active.hasAttribute(a)),value:null}:null;
 if(focus?.attr)focus.value=active.getAttribute(focus.attr);
 screen.innerHTML=state.screen==='home'?home():state.screen==='links'?linkScreen():serviceScreen();
 if(route!==renderedScreen){const heading=screen.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}window.scrollTo(0,0)}
 else if(focus){const target=focus.id?document.getElementById(focus.id):focus.attr?[...screen.querySelectorAll('['+focus.attr+']')].find(el=>el.getAttribute(focus.attr)===focus.value):null;target?.focus({preventScroll:true})}
 renderedScreen=route;
}
async function refresh(background=false){
 if(refreshing)return;refreshing=true;
 try{
  const d=await api('/state');
  // Polling may update status, but must never replace an active form or pending settings.
  const changed=JSON.stringify([state.accounts,state.link,state.localLink,state.tunnel,state.local,state.public])!==JSON.stringify([d.accounts,d.link,d.local_link,d.tunnel,d.local,d.public]);
  state.accounts=d.accounts;state.link=d.link;state.localLink=d.local_link;state.tunnel=d.tunnel;
  if(!background||state.screen!=='links'){state.local=d.local;state.public=d.public}
  if(!background){state.verification=d.verification;render()}
  else if(changed&&(state.screen==='home'||state.screen==='links'))render();
 }catch(e){if(!background){state.notice={text:e.message,error:true};render()}else $('live').textContent='Connection status unavailable. Retrying…'}
 finally{refreshing=false}
}
async function checkSelected(){
 const service=state.service,id=state.accountId;
 try{const r=await api('/action',{action:'check',service,id});if(state.service===service&&state.accountId===id){state.health={text:r.message};if(state.screen==='service'&&!state.editing)render()}}
 catch(e){if(state.service===service&&state.accountId===id){state.health={text:e.message,error:true};if(state.screen==='service'&&!state.editing)render()}}
}
function openService(service){state.service=service;state.screen='service';state.advanced=false;state.useToken=false;state.otherSchool=false;state.editing=false;state.draft={};state.visible={};state.notice=null;state.health=null;const a=state.accounts.find(x=>x.service===service);state.accountId=a?.id||'';if(service==='moodle'&&a&&a.url!=='https://moodle.polymtl.ca')state.otherSchool=true;if(a)checkSelected();render()}
async function send(data){if(state.busy)return;state.busy=true;render();try{const r=await api('/action',data);state.notice=r.message?{text:r.message}:null;if(r.verification){state.verification=r.verification;state.screen='service'}else if(['connect','verify','cancel','disconnect'].includes(data.action)){state.verification=null;if(data.action==='verify'){state.screen='home';state.editing=false}else if(data.action==='cancel'){state.screen='service'}else state.screen='home'}if(data.action==='connect')state.editing=false;if(r.stop)state.notice={text:'student-mcp stopped'};if(data.action==='permissions'){const a=selected();if(a)a.allow_write=data.allow_write}await refresh()}catch(e){state.notice={text:e.message,error:true}}finally{state.busy=false;render()}}
document.addEventListener('click',async e=>{
 const copy=e.target.closest('[data-copy]');
 if(copy){
  e.stopPropagation();const local=copy.dataset.copy==='local',url=local?state.localLink:state.link;
  if(!url||(local?!state.local:!state.tunnel.startsWith('Ready(')))return;
   try{
    await navigator.clipboard.writeText(url);$('live').textContent='Copied';
    const original=copy.innerHTML,aria=copy.getAttribute('aria-label');
    copy.innerHTML=icon('check');copy.classList.add('copy-confirmed');copy.setAttribute('aria-label','Copied');
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)copy.querySelector('svg').animate([{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1)'}],{duration:180,easing:'cubic-bezier(0.23, 1, 0.32, 1)'});
    setTimeout(()=>{if(!copy.isConnected)return;copy.innerHTML=original;copy.classList.remove('copy-confirmed');copy.setAttribute('aria-label',aria)},1300);
   }
  catch{state.notice={text:'Could not copy the link. Open connection settings and select the link to copy it manually.',error:true}}
   if(state.notice?.error)render();return;
 }
 const screen=e.target.closest('[data-screen]');
 if(screen){if(screen.dataset.screen==='home'&&state.verification){send({action:'cancel'});state.verification=null;}state.screen=screen.dataset.screen;state.notice=null;render();return}
 const opener=e.target.closest('[data-open]');if(opener){openService(opener.dataset.open);return}
 const account=e.target.closest('[data-account]');if(account){if(account.dataset.account===state.accountId&&!state.editing)return;state.accountId=account.dataset.account;state.editing=false;state.draft={};state.visible={};state.health=null;state.notice=null;state.advanced=false;state.otherSchool=state.service==='moodle'&&!!selected()&&selected().url!=='https://moodle.polymtl.ca';checkSelected();render();return}
 if(e.target.closest('[data-add]')){state.accountId='';state.editing=true;state.draft={};state.visible={};state.health=null;state.advanced=false;state.useToken=false;state.otherSchool=false;render();return}
 const eye=e.target.closest('[data-eye]');
 if(eye){const name=eye.dataset.eye;state.visible[name]=!state.visible[name];const field=$('f-'+name);field.type=state.visible[name]?'text':'password';eye.querySelector('.eye-slash').toggleAttribute('hidden',state.visible[name]);eye.setAttribute('aria-label',(state.visible[name]?'Hide ':'Show ')+field.labels[0].textContent);return}
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(action==='edit'){state.editing=true;state.advanced=false;state.draft={};state.visible={};render()}
 else if(action==='check'){if(selected())checkSelected()}
 else if(action==='disconnect'){const a=selected();if(a)send({action,service:state.service,id:a.id})}
 else if(action==='resend'||action==='cancel'){send({action})}
 else if(action==='apply-links'){const local=document.querySelector('[name=local]').checked,publicOn=document.querySelector('[name=public]').checked;send({action:'links',local:local||publicOn,public:publicOn})}
 else if(action==='stop')send({action:'stop'});
});
function connectReady(form){const v=Object.fromEntries(new FormData(form)),a=selected();if(state.service==='moodle')return !!v.token||!!v.username&&!!v.password;if(state.service==='omnivox')return v.token?!!v.gateway_url:!!(v.url||a?.url)&&!!v.username&&!!v.password;return !!(v.url||a?.url)&&(!!v.token||!!v.username&&!!v.password)}
document.addEventListener('change',e=>{if(e.target.name==='local'||e.target.name==='public'){const local=e.target.name==='local'?e.target.checked:state.local,publicOn=e.target.name==='public'?e.target.checked:state.public;state.local=local;state.public=publicOn;send({action:'links',local,public:publicOn})}});
document.addEventListener('input',e=>{if(e.target.name)state.draft[e.target.name]=e.target.value;if(e.target.form?.id==='connect-form')e.target.form.querySelector('button[type="submit"],button:not([type])').disabled=!connectReady(e.target.form)});
document.addEventListener('toggle',e=>{if(e.target.matches('.advanced'))state.advanced=e.target.open},true);
document.addEventListener('change',e=>{if(e.target.id==='account-picker'){state.accountId=e.target.value==='__new__'?'':e.target.value;state.editing=e.target.value==='__new__';state.draft={};state.visible={};state.health=null;state.verification=null;state.advanced=false;state.useToken=false;state.otherSchool=state.service==='moodle'&&!!selected()&&selected().url!=='https://moodle.polymtl.ca';if(selected())checkSelected();render()}if(e.target.name==='use_token'){state.useToken=e.target.checked;render()}if(e.target.name==='other_school'){state.otherSchool=e.target.checked;render()}if(e.target.name==='allow_write'){const a=selected();if(a)send({action:'permissions',service:state.service,id:a.id,allow_write:e.target.checked})}});
document.addEventListener('submit',e=>{if(e.target.id==='connect-form'){e.preventDefault();const form=e.target,d=Object.fromEntries(new FormData(form)),a=selected();if(!connectReady(form))return;d.service=state.service;d.action='connect';d.id=state.accountId||'';d.allow_write=true;if(state.service==='moodle')d.url=d.url||a?.url||'https://moodle.polymtl.ca';if(state.service==='omnivox'&&d.token)d.url=d.gateway_url;delete d.gateway_url;for(const name of ['password','token'])state.draft[name]='';send(d)}else if(e.target.id==='verify-form'){e.preventDefault();const code=e.target.elements.code.value;state.draft.code='';send({action:'verify',code})}});
refresh();const timer=setInterval(()=>{if(!document.hidden&&!state.busy)refresh(true)},1500);
</script></body></html>
